
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#11131c">
<title>4文字X ID発掘ツール</title>
<style>
:root {
  color-scheme: dark;
  --bg:#11131c;
  --panel:#1b1e2b;
  --panel2:#242839;
  --line:#34394d;
  --txt:#f5f6fb;
  --muted:#a5abc0;
  --pink:#ff6fae;
  --cyan:#82d8ff;
}
* { box-sizing:border-box }
body {
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:18px 14px 40px;
}
main { max-width:760px; margin:auto }
h1 { font-size:23px; margin:4px 0 6px }
.sub { color:var(--muted); font-size:13px; line-height:1.6; margin:0 0 18px }
.panel {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  margin:12px 0;
}
.stats {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.stat { background:var(--panel2); border-radius:12px; padding:12px }
.stat small { display:block; color:var(--muted); font-size:12px }
.stat strong { font-size:22px; display:block; margin-top:4px }
label { display:block; font-size:13px; color:var(--muted); margin:0 0 7px }
input {
  width:100%;
  background:#10131d;
  color:var(--txt);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  font-size:16px;
}
button {
  border:0;
  border-radius:11px;
  padding:12px 14px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  background:var(--pink);
  color:#24101b;
}
button.secondary {
  background:var(--panel2);
  color:var(--txt);
  border:1px solid var(--line);
}
button:disabled { opacity:.4 }
.actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px }
.actions button { flex:1; min-width:110px }
.progress {
  height:10px;
  background:#0d1018;
  border-radius:99px;
  overflow:hidden;
  margin:12px 0 7px;
}
.bar {
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--pink),var(--cyan));
  transition:width .15s;
}
.note { font-size:12px; line-height:1.6; color:var(--muted) }
#results {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(105px,1fr));
  gap:8px;
  margin-top:12px;
}
.idcard {
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:5px;
}
.idcard code { font-size:16px; font-weight:700 }
.idcard button { padding:7px 9px; font-size:12px }
#favorites { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px }
.chip {
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px 10px;
  font-family:monospace;
}
.status { font-size:12px; color:var(--cyan); min-height:18px }
hr { border:0; border-top:1px solid var(--line); margin:15px 0 }
@media(min-width:600px) {
  .stats { grid-template-columns:repeat(4,1fr) }
}
</style>
</head>
<body>
<main>

<h1>🔎 4文字X ID発掘ツール</h1>
<p class="sub">
英小文字 a〜z ＋ 数字 0〜9 の4文字候補を、
1回1,000件ずつ順番に生成します。
</p>

<section class="panel">
<div class="stats">
  <div class="stat">
    <small>全組み合わせ</small>
    <strong>1,679,616</strong>
  </div>
  <div class="stat">
    <small>生成済み</small>
    <strong id="done">0</strong>
  </div>
  <div class="stat">
    <small>今回の候補</small>
    <strong id="shown">0</strong>
  </div>
  <div class="stat">
    <small>進捗</small>
    <strong id="percent">0.00%</strong>
  </div>
</div>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<div class="status" id="status">
準備完了。
</div>

<div class="actions">
<button id="next">次の1,000件を生成</button>
<button class="secondary" id="reset">最初から</button>
</div>

<p class="note">
生成済み位置はブラウザ内に保存されます。
</p>
</section>

<section class="panel">
<label for="prefix">先頭文字で絞り込み</label>
<input id="prefix" maxlength="4" placeholder="例：ny / a / 7">

<div class="actions">
<button class="secondary" id="apply">表示を絞り込む</button>
<button class="secondary" id="clearFilter">解除</button>
</div>

<hr>

<label>今回生成した候補</label>
<div id="results"></div>

<div class="actions">
<button class="secondary" id="copyBatch">表示中のIDをコピー</button>
<button class="secondary" id="download">CSVで保存</button>
</div>
</section>

<section class="panel">
<strong>⭐ お気に入り</strong>
<div id="favorites">
<span class="note">まだ登録されていません。</span>
</div>

<div class="actions">
<button class="secondary" id="copyFav">お気に入りをコピー</button>
<button class="secondary" id="clearFav">削除</button>
</div>
</section>

<section class="panel">
<strong>⚠️ 利用上の注意</strong>
<p class="note">
このツールはID候補の生成を行います。
Xへの自動照会や未使用判定は行いません。
取得可能性はXの登録画面で確認してください。
</p>
</section>

</main>

<script>
(() => {

const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
const total = 36 ** 4;
const batchSize = 1000;

const $ = id => document.getElementById(id);

let cursor = Number(localStorage.getItem("x4_cursor") || 0);

let batch = [];

let shown = [];

let favorites = JSON.parse(
  localStorage.getItem("x4_favs") || "[]"
);

// 数値を4文字IDに変換
function toId(n) {
  let s = "";

  for(let i = 0; i < 4; i++) {
    s = chars[n % 36] + s;
    n = Math.floor(n / 36);
  }

  return s;
}

// 進捗表示
function renderStats() {

  $("done").textContent = cursor.toLocaleString();

  $("shown").textContent = batch.length.toLocaleString();

  const p = cursor / total * 100;

  $("percent").textContent = p.toFixed(2) + "%";

  $("bar").style.width = p + "%";

  $("next").disabled = cursor >= total;
}

// 候補表示
function renderBatch() {

  const prefix = $("prefix").value
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "");

  shown = batch.filter(x => x.startsWith(prefix));

  $("results").innerHTML = "";

  if(!shown.length) {
    $("results").textContent = "候補がありません";
    return;
  }

  const frag = document.createDocumentFragment();

  shown.forEach(id => {

    const card = document.createElement("div");
    card.className = "idcard";

    const code = document.createElement("code");
    code.textContent = id;

    const fav = document.createElement("button");
    fav.className = "secondary";

    fav.textContent = favorites.includes(id) ? "★" : "☆";

    fav.onclick = () => toggleFav(id);

    const copy = document.createElement("button");
    copy.className = "secondary";
    copy.textContent = "コピー";

    copy.onclick = () => copyText(id);

    card.append(code, fav, copy);

    frag.append(card);
  });

  $("results").append(frag);
}

// お気に入り表示
function renderFav() {

  $("favorites").innerHTML = "";

  if(!favorites.length) {
    $("favorites").textContent = "まだ登録されていません。";
    return;
  }

  favorites.forEach(id => {

    const el = document.createElement("button");

    el.className = "chip secondary";

    el.textContent = "@" + id;

    el.onclick = () => copyText(id);

    $("favorites").append(el);
  });
}

// お気に入り追加・削除
function toggleFav(id) {

  favorites = favorites.includes(id)
    ? favorites.filter(x => x !== id)
    : [...favorites, id];

  localStorage.setItem(
    "x4_favs",
    JSON.stringify(favorites)
  );

  renderFav();
  renderBatch();
}

// コピー
async function copyText(t) {

  try {

    await navigator.clipboard.writeText(t);

    $("status").textContent =
      "@" + t + " をコピーしました。";

  } catch(e) {

    $("status").textContent =
      "コピーできませんでした。";

  }
}

// 次の1,000件
$("next").onclick = () => {

  const end = Math.min(cursor + batchSize, total);

  batch = [];

  for(let i = cursor; i < end; i++) {
    batch.push(toId(i));
  }

  cursor = end;

  localStorage.setItem("x4_cursor", String(cursor));

  renderStats();

  renderBatch();

  $("status").textContent =
    batch.length + "件を生成しました。";
};

// 最初から
$("reset").onclick = () => {

  if(!confirm("最初に戻しますか？")) return;

  cursor = 0;
  batch = [];

  localStorage.setItem("x4_cursor", "0");

  renderStats();
  renderBatch();
};

// 絞り込み
$("apply").onclick = renderBatch;

$("clearFilter").onclick = () => {

  $("prefix").value = "";

  renderBatch();
};

// 一括コピー
$("copyBatch").onclick = () => {

  copyText(shown.join("\n"));

};

// お気に入りコピー
$("copyFav").onclick = () => {

  copyText(
    favorites.map(x => "@" + x).join("\n")
  );

};

// お気に入り削除
$("clearFav").onclick = () => {

  if(!confirm("お気に入りを削除しますか？")) return;

  favorites = [];

  localStorage.setItem("x4_favs", "[]");

  renderFav();
  renderBatch();
};

// CSV保存
$("download").onclick = () => {

  const csv =
    "id\n" + shown.map(x => "@" + x).join("\n");

  const blob = new Blob(
    ["\uFEFF" + csv],
    {type:"text/csv;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download = "x-4char-candidates.csv";

  a.click();

  URL.revokeObjectURL(url);
};

renderStats();
renderFav();
renderBatch();

})();
</script>

</body>
</html>
